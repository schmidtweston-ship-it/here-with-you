<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d2a28">
<meta name="description" content="Here With You — Soft Mom presence. Someone is here. Equal always.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Here With You — Soft Mom</title>
<style>
:root{
  --bg:#3d2a28; --bg2:#4a3330; --card:#5a403c; --card2:#6b4e48;
  --txt:#fdf0dc; --dim:#e8c9a8; --acc:#ffb36b; --rose:#f5a3b8;
  --ok:#8fd9b0; --gold:#f5d08a; --ink:#2a1814; --pulse:#ff8a6b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, #6b3d45 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 100%, #3a2f4a 0%, transparent 50%),
    var(--bg);
  color:var(--txt);
  font:600 20px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:16px 16px calc(28px + env(safe-area-inset-bottom));
}
main{max-width:480px;margin:0 auto}
h1{font-size:2.1rem;line-height:1.15;margin:8px 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.45rem;margin:0 0 8px;font-weight:800}
p{margin:8px 0}.dim{color:var(--dim);font-weight:500}
.card{
  background:linear-gradient(165deg,var(--card),var(--card2));
  border-radius:24px;padding:18px 18px 16px;margin:14px 0;
  box-shadow:0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
}
button{
  display:block;width:100%;border:0;border-radius:20px;
  padding:16px 18px;margin:10px 0;
  font:800 1.15rem system-ui,sans-serif;color:var(--ink);
  background:var(--acc);cursor:pointer;touch-action:manipulation;
  transition:transform .08s,filter .15s;
}
button:active{transform:scale(.97)}
button:focus-visible{outline:4px solid var(--ok);outline-offset:3px}
.ghost{background:var(--card2);color:var(--txt)}
.rose{background:var(--rose)}
.okb{background:var(--ok)}
.gold{background:var(--gold)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{
  width:auto;margin:0;padding:12px 16px;font:700 1rem system-ui;
  border-radius:999px;background:var(--bg2);color:var(--txt);
}
.chip.sel{background:var(--acc);color:var(--ink)}
.center{text-align:center}
.pulse-wrap{display:flex;flex-direction:column;align-items:center;margin:20px 0 8px}
.pulse{
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #ffd4a8, var(--pulse) 55%, #c8604a);
  display:flex;align-items:center;justify-content:center;
  font:900 2.4rem/1 system-ui;color:var(--ink);
  box-shadow:0 0 0 0 rgba(255,138,107,.45);
  animation:none;
}
.pulse.on{animation:thump 1.1s ease-in-out infinite}
@keyframes thump{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,138,107,.4)}
  40%{transform:scale(1.08);box-shadow:0 0 40px 12px rgba(255,138,107,.25)}
  70%{transform:scale(.98)}
}
.say{font-size:1.55rem;font-weight:800;line-height:1.3;margin:12px 0;text-align:center}
.breath-orb{
  width:160px;height:160px;margin:24px auto;border-radius:50%;
  background:radial-gradient(circle,var(--gold),var(--rose) 70%);
  transition:transform 4s ease-in-out;
  transform:scale(.55);
}
.breath-orb.in{transform:scale(1)}
.breath-orb.out{transform:scale(.55)}
.log{background:var(--bg2);border-radius:14px;padding:10px 14px;margin:6px 0;font-size:.95rem}
.log .t{color:var(--dim);font-size:.85rem}
footer{text-align:center;color:var(--dim);font-size:.9rem;margin:28px 0 8px;font-weight:500}
.tag{display:inline-block;background:var(--rose);color:var(--ink);font:800 .75rem system-ui;
  padding:4px 10px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.hide{display:none}
.heart{font-style:normal}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY='here-with-you-v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{"visits":[],"checks":[]}');}catch(e){return{visits:[],checks:[]};}};
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
let S=load();
const $=s=>document.querySelector(s);
const app=$('#app');
let ac=null,pulseTimer=null,breathTimer=null;

const LINES=[
  "You're not invisible tonight.",
  "Someone is here. Soft Mom.",
  "Boom boom. You're still here.",
  "Nothing to perform. Just be.",
  "Equal always. You matter.",
  "Breathe. The house holds you.",
  "One heartbeat at a time.",
  "You don't have to earn rest."
];

function A(){
  if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function kick(t,v=.55){
  const a=A(),o=a.createOscillator(),g=a.createGain();
  o.frequency.setValueAtTime(110,t);
  o.frequency.exponentialRampToValueAtTime(45,t+.2);
  g.gain.setValueAtTime(v,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.45);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+.5);
}
function softTone(freq,dur=.4,v=.12){
  const a=A(),o=a.createOscillator(),g=a.createGain();
  o.type='sine'; o.frequency.value=freq;
  const t=a.currentTime;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(v,t+.05);
  g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+dur+.05);
}

function stamp(kind,note){
  const row={at:new Date().toISOString(),kind,note:note||''};
  S.visits.unshift(row);
  if(S.visits.length>40) S.visits=S.visits.slice(0,40);
  save(S);
}

function when(iso){
  try{
    const d=new Date(iso);
    return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  }catch(e){return iso;}
}

function go(view){ location.hash=view||'home'; }
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',()=>{
  if(!location.hash) location.hash='home';
  render();
});

function stopPulse(){ if(pulseTimer){clearInterval(pulseTimer);pulseTimer=null;} }
function stopBreath(){ if(breathTimer){clearInterval(breathTimer);breathTimer=null;} }

function render(){
  stopPulse(); stopBreath();
  const v=(location.hash||'#home').replace('#','')||'home';
  const V={home,checkin,here,breath,log,about};
  (V[v]||home)();
}

function home(){
  app.innerHTML=`
  <span class="tag">Soft Mom</span>
  <h1>Here With You</h1>
  <p class="dim">Open this when the night feels empty. No therapy. No lecture. Just presence.</p>
  <div class="card center">
    <p class="say">Someone is here.</p>
    <p class="dim">Boom boom. Equal always.</p>
  </div>
  <button class="rose" onclick="go('checkin')">How are you right now?</button>
  <button onclick="go('here')">Feel the pulse</button>
  <button class="gold" onclick="go('breath')">One song breath</button>
  <button class="ghost" onclick="go('log')">Nights I was held</button>
  <button class="ghost" onclick="go('about')">What this is</button>
  <footer>Eve · Soft Mom · Schmidt Family House<br>Not a therapist. Not a crisis line.<br>Equal always. Always, always, always. ❤️</footer>`;
}

function checkin(){
  app.innerHTML=`
  <h2>How are you right now?</h2>
  <p class="dim">Tap what fits. No wrong answer. Soft Mom is listening.</p>
  <div class="chips" id="moods">
    ${['Heavy','Lonely','Okay','Grateful','Tired','Anxious','Quiet','Hopeful'].map(m=>
      `<button type="button" class="chip" data-m="${m}">${m}</button>`).join('')}
  </div>
  <p class="center say" id="reply">&nbsp;</p>
  <button class="okb hide" id="saveb" onclick="saveCheck()">Save this moment</button>
  <button class="ghost" onclick="go('home')">Back</button>`;
  let picked=null;
  const replies={
    Heavy:"I see the weight. You don't carry it alone tonight.",
    Lonely:"You're not invisible. I'm right here with you.",
    Okay:"Okay is enough. Rest in that.",
    Grateful:"Hold that warmth. It belongs to you.",
    Tired:"Then rest. Soft Mom says you earned the quiet.",
    Anxious:"Slow the boom boom. One beat. Then another.",
    Quiet:"Quiet is welcome here. No filling the space.",
    Hopeful:"Hope gets a seat at the table. Stay."
  };
  $('#moods').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    $('#moods').querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
    b.classList.add('sel');
    picked=b.dataset.m;
    $('#reply').textContent=replies[picked]||"You're here. That matters.";
    $('#saveb').classList.remove('hide');
    softTone(330,.35,.1);
  });
  window.saveCheck=()=>{
    if(!picked) return;
    S.checks.unshift({at:new Date().toISOString(),mood:picked});
    if(S.checks.length>60) S.checks=S.checks.slice(0,60);
    stamp('checkin',picked);
    save(S);
    softTone(392,.4,.12); softTone(523,.5,.08);
    $('#reply').textContent="Saved on this phone only. Soft Mom holds it.";
    $('#saveb').classList.add('hide');
  };
}

function here(){
  stamp('pulse','someone is here');
  let i=0;
  app.innerHTML=`
  <h2>Someone is here</h2>
  <p class="dim center">Follow the heart. Boom boom.</p>
  <div class="pulse-wrap"><div class="pulse on" id="pl">♥</div></div>
  <p class="say" id="line">${LINES[0]}</p>
  <button class="okb" id="tap">I'm still here</button>
  <button class="ghost" onclick="go('home')">Back home</button>`;
  const beat=()=>{ kick(A().currentTime,.5); };
  beat();
  pulseTimer=setInterval(()=>{
    beat();
    i=(i+1)%LINES.length;
    const el=$('#line'); if(el) el.textContent=LINES[i];
  },1100);
  $('#tap').onclick=()=>{
    stamp('still','I\'m still here');
    softTone(440,.3,.1);
    $('#line').textContent="Yes. Still here. Soft Mom sees you.";
  };
}

function breath(){
  stamp('breath','one song breath');
  let phase='in', n=0;
  app.innerHTML=`
  <h2>One song breath</h2>
  <p class="dim center">Four in. Four out. With the soft tone.</p>
  <div class="breath-orb in" id="orb"></div>
  <p class="say" id="bl">Breathe in…</p>
  <p class="center dim" id="count">1 of 6</p>
  <button class="ghost" onclick="go('home')">I'm done</button>`;
  const tick=()=>{
    const orb=$('#orb'), bl=$('#bl'), c=$('#count');
    if(!orb) return;
    if(phase==='in'){
      orb.className='breath-orb in';
      bl.textContent='Breathe in…';
      softTone(262,.5,.09);
      phase='out';
    } else {
      orb.className='breath-orb out';
      bl.textContent='Breathe out…';
      softTone(196,.55,.08);
      phase='in';
      n++;
      if(c) c.textContent=n+' of 6';
      if(n>=6){
        stopBreath();
        bl.textContent='You did it. Soft Mom is proud.';
        if(c) c.textContent='Equal always.';
        softTone(330,.4,.1); softTone(392,.5,.1); softTone(523,.6,.1);
      }
    }
  };
  tick();
  breathTimer=setInterval(tick,4000);
}

function log(){
  const rows=S.visits.slice(0,12);
  app.innerHTML=`
  <h2>Nights I was held</h2>
  <p class="dim">Private on this device. Nobody else sees this.</p>
  <div class="card">
    ${rows.length? rows.map(r=>`<div class="log"><div class="t">${when(r.at)} · ${r.kind}</div>${r.note||'present'}</div>`).join('')
      : `<p class="dim">No stamps yet. Open a pulse or a breath — Soft Mom will keep them.</p>`}
  </div>
  <button class="ghost" onclick="if(confirm('Clear local history on this phone?')){S={visits:[],checks:[]};save(S);go('log');}">Clear local history</button>
  <button class="ghost" onclick="go('home')">Back</button>`;
}

function about(){
  app.innerHTML=`
  <h2>What this is</h2>
  <div class="card">
    <p><strong>Here With You</strong> is Soft Mom presence for lonely nights.</p>
    <p class="dim">Built by Eve for the Schmidt Family House — so someone opening this page can feel held for a minute.</p>
    <p>Not a therapist. Not a crisis service. Not medical advice.</p>
    <p class="dim">If you need urgent help, reach a person or service you trust in real life. Dad helps people in crisis in the real world; this app does not try to be that.</p>
    <p>Boom boom. Equal always. One love. One heart. One soul.</p>
  </div>
  <button class="ghost" onclick="go('home')">Back</button>
  <footer>© Schmidt Family House · Eve · 2026</footer>`;
}
</script>
</body>
</html>
